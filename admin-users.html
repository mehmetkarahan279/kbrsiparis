<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBR | Kullanıcı Yönetimi</title>
  <style>
    body { font: 16px Arial, sans-serif; max-width: 900px; margin: 35px auto; padding: 0 16px; background:#f3f5f7; color:#1f2937; }
    section { background:white; padding:20px; margin:16px 0; border-radius:10px; }
    input, select, button { width:100%; box-sizing:border-box; padding:11px; margin:6px 0 14px; font:inherit; }
    button { background:#17633d; color:white; border:0; border-radius:6px; cursor:pointer; }
    button.secondary { background:#475569; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:9px; border-bottom:1px solid #ddd; }
    .scroll { overflow-x:auto; }
    #message { white-space:pre-wrap; margin:12px 0; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <h1>KBR kullanıcı yönetimi</h1>
  <div id="message"></div>

  <section id="login-section">
    <h2>Admin girişi</h2>
    <form id="login-form">
      <label>E-posta</label>
      <input id="login-email" type="email" required>
      <label>Şifre</label>
      <input id="login-password" type="password" required>
      <button>Giriş yap</button>
    </form>
  </section>

  <div id="admin-panel" class="hidden">
    <button id="logout-button" class="secondary">Çıkış yap</button>

    <section>
      <h2>Yeni kullanıcı oluştur</h2>
      <form id="create-form">
        <label>Kullanıcı adı</label>
        <input id="username" required minlength="3">

        <label>Ad soyad</label>
        <input id="full-name">

        <label>E-posta</label>
        <input id="new-email" type="email" required>

        <label>Başlangıç şifresi (en az 8 karakter)</label>
        <input id="new-password" type="password" required minlength="8">

        <label>Rol</label>
        <select id="role">
          <option value="seller">Satıcı</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Kullanıcı oluştur</button>
      </form>
    </section>

    <section>
      <h2>Kullanıcılar</h2>
      <button id="refresh-button" class="secondary">Listeyi yenile</button>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Kullanıcı adı</th><th>Ad soyad</th><th>Rol</th><th>Durum</th></tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
   const SUPABASE_URL = "https://dqejxcvacocisdgcwwdw.supabase.co";
const PUBLIC_KEY = "sb_publishable_KUa4pP3ANnd9C2qfcZ5TTA_2n_pilbz";
const db = window.supabase.createClient(SUPABASE_URL, PUBLIC_KEY);
const $ = (id) => document.getElementById(id);

    function showMessage(text, error = false) {
      $("message").textContent = text;
      $("message").style.color = error ? "#a83232" : "#17633d";
    }

    async function loadUsers() {
      const { data, error } = await db.from("profiles")
        .select("username, full_name, role, active, created_at")
        .order("created_at", { ascending: false });

      if (error) return showMessage("Kullanıcı listesi alınamadı: " + error.message, true);

      $("users-body").innerHTML = (data || []).map(u => `
        <tr>
          <td>${u.username || ""}</td>
          <td>${u.full_name || ""}</td>
          <td>${u.role}</td>
          <td>${u.active ? "Aktif" : "Kapalı"}</td>
        </tr>
      `).join("");
    }

    async function openAdminPanel(user) {
      const { data, error } = await db.from("profiles")
        .select("role, active")
        .eq("id", user.id)
        .single();

      if (error || !data?.active || data.role !== "admin") {
        await db.auth.signOut();
        $("login-section").classList.remove("hidden");
        return showMessage("Bu sayfayı yalnızca aktif admin kullanabilir.", true);
      }

      $("login-section").classList.add("hidden");
      $("admin-panel").classList.remove("hidden");
      await loadUsers();
    }

    $("login-form").addEventListener("submit", async event => {
      event.preventDefault();
      const { data, error } = await db.auth.signInWithPassword({
        email: $("login-email").value,
        password: $("login-password").value
      });

      if (error) return showMessage("Giriş başarısız: " + error.message, true);
      await openAdminPanel(data.user);
    });

    $("create-form").addEventListener("submit", async event => {
      event.preventDefault();
      showMessage("Kullanıcı oluşturuluyor…");

      const { data, error } = await db.functions.invoke("admin-create-user", {
        body: {
          username: $("username").value.trim(),
          full_name: $("full-name").value.trim(),
          email: $("new-email").value.trim(),
          password: $("new-password").value,
          role: $("role").value
        }
      });

      if (error) {
        let detail = error.message;
        try {
          const response = error.context?.clone
            ? error.context.clone()
            : error.context;
          if (response) {
            const body = await response.json();
            detail = body.error || body.message || detail;
          }
        } catch (_) {}
        return showMessage("Kullanıcı oluşturulamadı: " + detail, true);
      }

      $("create-form").reset();
      showMessage(`Kullanıcı oluşturuldu: ${data.username} (${data.role}).`);
      await loadUsers();
    });

    $("refresh-button").addEventListener("click", loadUsers);

    $("logout-button").addEventListener("click", async () => {
      await db.auth.signOut();
      location.reload();
    });

    db.auth.getSession().then(async ({ data }) => {
      if (data.session) await openAdminPanel(data.session.user);
      else $("login-section").classList.remove("hidden");
    });
  </script>
</body>
</html>
