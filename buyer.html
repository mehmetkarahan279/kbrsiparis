<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBR Sipariş Özeti ve Onayı</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font: 15px Arial, sans-serif;
      color: #1f2937;
      background: #f3f5f7;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 22px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px #00000012;
    }

    h1 { color: #163c2b; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      min-width: 850px;
    }

    th, td {
      padding: 9px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }

    .scroll { overflow-x: auto; }

    .info {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 7px;
      padding: 14px;
      margin: 14px 0;
      line-height: 1.7;
    }

    .totals {
      max-width: 460px;
      margin: 14px 0 14px auto;
      line-height: 1.9;
    }

    .discounts {
      min-width: 250px;
      font-size: 12px;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }

    button {
      padding: 12px 16px;
      margin: 10px 8px 0 0;
      border: 0;
      border-radius: 6px;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .approve { background: #17633d; }
    .reject { background: #a83232; }
    #message { margin: 14px 0; white-space: pre-wrap; }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      main { padding: 15px; }
    }
  </style>
</head>

<body>
<main>
  <h1>KBR Sipariş Özeti</h1>
  <div id="message" role="status">Sipariş yükleniyor…</div>

  <div id="order" class="hidden">
    <div class="info">
      <div><strong>Sipariş no:</strong> <span id="order-number"></span></div>
      <div><strong>Alıcı:</strong> <span id="customer-name"></span></div>
      <div><strong>Yetkili:</strong> <span id="authorized-name"></span></div>
      <div><strong>Ödeme vadesi:</strong> <span id="payment-term"></span></div>
      <div><strong>Ödeme şekli:</strong> <span id="payment-method"></span></div>
      <div><strong>Teslimat adresi:</strong> <span id="delivery-address"></span></div>
      <div><strong>Teslim şekli:</strong> <span id="delivery-method"></span></div>
    </div>

    <h2>Sipariş kalemleri</h2>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Kod</th>
            <th>Ürün</th>
            <th>Adet</th>
            <th>Birim fiyat</th>
            <th>Ara tutar</th>
            <th>Ürün iskontoları</th>
            <th>İskonto tutarı</th>
            <th>Net tutar</th>
          </tr>
        </thead>
        <tbody id="items"></tbody>
      </table>
    </div>

    <div class="totals">
      <div>Ara toplam: <strong id="subtotal"></strong></div>
      <div>Toplam iskonto: <strong id="discount-amount"></strong></div>
      <div style="font-size:18px; margin-top:6px;">
        Net toplam: <strong id="total"></strong>
      </div>
    </div>

    <div class="info">
      <label for="note"><strong>Notunuz (isteğe bağlı)</strong></label>
      <textarea id="note" maxlength="1000"></textarea>
    </div>

    <button type="button" class="approve" id="approve">Siparişi onayla</button>
    <button type="button" class="reject" id="reject">Siparişi reddet</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dqejxcvacocisdgcwwdw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_KUa4pP3ANnd9C2qfcZ5TTA_2n_pilbz";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const $ = id => document.getElementById(id);
  const token = new URLSearchParams(window.location.search).get("token");

  let tokenHash = "";

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[character]));
  }

  function money(value) {
    return Number(value || 0).toLocaleString("tr-TR", {
      style: "currency",
      currency: "TRY"
    });
  }

  async function hashToken(value) {
    const digest = await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(value)
    );

    return Array.from(new Uint8Array(digest), byte =>
      byte.toString(16).padStart(2, "0")
    ).join("");
  }

  async function loadOrder() {
    if (!token) {
      $("message").textContent = "Onay bağlantısı eksik.";
      return;
    }

    try {
      tokenHash = await hashToken(token);

      const { data, error } = await db.rpc("get_order_by_token", {
        p_token_hash: tokenHash
      });

      if (error) {
        $("message").textContent =
          "Sipariş bilgileri alınamadı: " + error.message;
        return;
      }

      if (!data) {
        $("message").textContent =
          "Sipariş bulunamadı. Bağlantı süresi dolmuş veya sipariş daha önce yanıtlanmış olabilir.";
        return;
      }

      $("order-number").textContent = data.order_number || "";
      $("customer-name").textContent = data.customer_name || "";
      $("authorized-name").textContent = data.authorized_name || "—";
      $("payment-term").textContent = data.payment_term || "—";
      $("payment-method").textContent = data.payment_method || "—";
      $("delivery-address").textContent = data.delivery_address || "—";
      $("delivery-method").textContent = data.delivery_method || "—";

      const items = Array.isArray(data.items) ? data.items : [];

      $("items").innerHTML = items.map(item => {
        const rates = [1, 2, 3, 4, 5].map(index =>
          Number(item["isk" + index] || 0)
        );

        const discountText = rates.map((rate, index) =>
          `İSK${index + 1}: ${rate}%`
        ).join(" | ");

        return `
          <tr>
            <td>${escapeHtml(item.product_code)}</td>
            <td>${escapeHtml(item.description)}</td>
            <td>${escapeHtml(item.quantity)}</td>
            <td>${money(item.unit_price)}</td>
            <td>${money(item.line_total)}</td>
            <td class="discounts">${escapeHtml(discountText)}</td>
            <td>${money(item.discount_amount)}</td>
            <td><strong>${money(item.net_total)}</strong></td>
          </tr>
        `;
      }).join("");

      $("subtotal").textContent = money(data.subtotal);
      $("discount-amount").textContent = money(data.discount_amount);
      $("total").textContent = money(data.total_amount);

      $("message").textContent = "";
      $("order").classList.remove("hidden");
    } catch (error) {
      $("message").textContent =
        "Sipariş yüklenirken hata oluştu: " +
        (error instanceof Error ? error.message : "Bilinmeyen hata.");
    }
  }

  async function respond(response) {
    $("approve").disabled = true;
    $("reject").disabled = true;
    $("message").textContent = "Yanıtınız kaydediliyor…";

    const { error } = await db.rpc("respond_to_order", {
      p_token_hash: tokenHash,
      p_response: response,
      p_note: $("note").value
    });

    if (error) {
      $("message").textContent = "Yanıt kaydedilemedi: " + error.message;
      $("approve").disabled = false;
      $("reject").disabled = false;
      return;
    }

    $("order").classList.add("hidden");
    $("message").textContent = response === "approved"
      ? "Siparişiniz onaylandı. Teşekkür ederiz."
      : "Siparişiniz reddedildi. Yanıtınız sisteme kaydedildi.";
  }

  $("approve").addEventListener("click", () => respond("approved"));
  $("reject").addEventListener("click", () => respond("rejected"));

  loadOrder();
</script>
</body>
</html>
